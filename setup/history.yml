name: Refresh aurora history

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays, 09:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Rebuild everything since 1932 (about a minute)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild history
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python collector/history.py
          else
            python collector/history.py --recent
          fi
      - name: Commit if changed
        run: |
          git config user.name "aurora-bot"
          git config user.email "aurora-bot@users.noreply.github.com"
          git add data/nights.csv docs/data/history.json
          git diff --cached --quiet || git commit -m "Refresh aurora history"
          git push
